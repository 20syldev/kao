name: CI

# Checks for pull requests and manual runs. Deploy runs this workflow on master and Release on
# version tags, so a plain push to a branch starts nothing.
on:
    pull_request:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - name: Every part referenced by the menus is present
              run: npm run check:assets
            - run: shellcheck -x start.sh scripts/swf.sh scripts/engine.sh scripts/ffdec.sh
            - run: python3 -m py_compile scripts/assets.py

    swf:
        name: Build the loader
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21
            - run: npm run build:swf
            - name: The committed loader matches its source
              run: git diff --exit-code --stat public/MAIN.swf
            - uses: actions/upload-artifact@v7
              with:
                  name: MAIN.swf
                  path: public/MAIN.swf

    e2e:
        name: Build & end-to-end
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            # Uses the Google Chrome preinstalled on GitHub runners.
            - run: npm test
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
