name: Release

on:
    push:
        tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
    contents: write

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    release:
        name: Draft release
        needs: ci
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Bundle the editor
              run: |
                  NAME="kao-$GITHUB_REF_NAME"
                  mkdir -p "dist/$NAME"
                  cp -r out docs start.sh README.md LICENSE "dist/$NAME/"
                  (cd dist && zip -qr "$NAME.zip" "$NAME")
            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" "dist/kao-$GITHUB_REF_NAME.zip" \
                      --draft --title "" \
                      --notes "# Version $GITHUB_REF_NAME - $(LC_ALL=C date +'%B %Y')"
